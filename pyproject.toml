[project]
name = "simple-agent"
version = "0.1.0"
description = "A small, readable CLI agent for learning how LLM agents work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
simple-agent = "simple_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simple_agent*"]
