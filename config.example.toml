# Copy this file to config.toml (or ~/.config/simple-agent/config.toml) and edit.
# Command-line flags override anything set here.

# Which provider to use: "openai" (any OpenAI-compatible server, e.g. LM Studio) or "anthropic".
provider = "openai"

# The system prompt the agent starts every conversation with.
# system_prompt = "You are a helpful assistant..."

# Safety net: the most model calls the agent makes for a single user message.
max_steps = 10

# Show replies as they are generated (same as leaving out --no-stream).
stream = true

# Trace mode: print every step of the agent loop and save it as JSONL (same as --trace).
trace = false
trace_dir = "traces"

# Where /save, /load and --resume keep conversations.
sessions_dir = "sessions"

# Sub-agents: offer the model a "delegate" tool that runs a subtask in a fresh
# helper agent (same as leaving out --no-subagents).
subagents = true

# Planning: offer the model an "update_plan" tool for a to-do list that is shown
# to it at every step (same as leaving out --no-planning).
planning = true

# Project instructions: follow the rules in AGENTS.md files (this folder, the folders above
# it up to the top of the git repository, and ~/.config/simple-agent/AGENTS.md).
# Same as leaving out --no-instructions; /instructions in the chat shows what was read.
project_instructions = true

# Long-term memory: the agent keeps notes between conversations as Markdown files in
# memory_dir and sees their titles at every step (same as leaving out --no-memory;
# /memory in the chat lists them). Use "~/.config/simple-agent/memory" to share one
# memory across every folder you run the agent in.
memory = true
memory_dir = "memory"

# After each answer, show the tokens it used (and the cost, for models with a price)
# plus the session total (same as leaving out --no-usage; /usage on|off in the chat).
show_usage = true

# Folders to load plugin tools from (see "Plugins" in the README).
# plugin_dirs = ["plugins", "~/.config/simple-agent/plugins"]

[providers.openai]
# LM Studio's local server. Ollama is http://localhost:11434/v1, OpenAI is https://api.openai.com/v1.
base_url = "http://localhost:1234/v1"
# Use the model identifier LM Studio shows for the loaded model.
model = "qwen2.5-7b-instruct"
# Local servers ignore the key; for a cloud service set OPENAI_API_KEY instead of writing it here.
api_key = "lm-studio"

[providers.anthropic]
model = "claude-opus-5-5"
# The key is read from the ANTHROPIC_API_KEY environment variable.

[context]
# Keep the conversation under a token limit (see "Context management" in the README).
# Set max_tokens a bit below the model's context length (LM Studio: the "Context Length"
# you loaded the model with; 4096 is a common default there).
max_tokens = 8000
# 1. Replace old tool results with a short placeholder, keeping the newest few.
clear_tool_results = true
keep_tool_results = 3
# 2. If still too big, summarize older turns, keeping the last few word for word.
compact = true
keep_recent_turns = 2
# enabled = false   # turn context management off entirely

[sandbox]
# Keep the file tools and run_shell inside one folder, the workspace (see "Sandbox" in the README).
# "." is the folder you start simple-agent in; use an absolute path to always work in one folder.
workspace = "."
# Files the agent can't read or write even inside the workspace (patterns, matched against names).
protected = [".env", "config.toml"]
# "auto": also run shell commands in the operating system's sandbox when there is one
# (bubblewrap on Linux, sandbox-exec on macOS); "off": path checks only.
os_sandbox = "auto"
# enabled = false   # no sandbox: the tools can reach any file you can (same as --no-sandbox)

# MCP servers: each one adds its tools next to the built-in ones (see "MCP servers" in the README).
# Their tools ask y/N before every call unless the server has trusted = true.
# [mcp_servers.files]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
# trusted = false
# env = { SOME_TOKEN = "..." }

# Settings for a plugin go in [plugins.<file name>]; the plugin reads them with settings().
# plugins/web.py (web_search and web_fetch, see "Web search and fetch" in the README):
# [plugins.web]
# searxng_url = "http://localhost:8080"   # your SearXNG, with json enabled in its settings.yml
# max_results = 5                         # search results per web_search
# max_chars = 8000                        # page text per web_fetch call
# allow_local = false                     # let web_fetch reach your own machine and network
# allow_hosts = ["localhost:3000"]        # or just these local addresses

# Prices in US dollars per million tokens, for the cost in the usage line and eval results.
# Current Claude models are built in; add others (or override) here. Models without
# a price, such as local ones in LM Studio, show tokens only.
# [prices]
# "some-cloud-model" = { input = 1.00, output = 4.00 }   # use the provider's real prices
